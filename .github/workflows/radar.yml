name: Radar Promos

on:
  schedule:
    - cron: "*/15 * * * *"   # toutes les 15 minutes (GitHub peut décaler de quelques minutes)
  workflow_dispatch: {}       # bouton « Run workflow » pour lancer à la main

concurrency:
  group: radar
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Chercher les bonnes affaires
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: uv run radar-promos

      - name: Sauvegarder l'historique des prix
        run: |
          git config user.name "radar-promos"
          git config user.email "radar-promos@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "Historique des prix $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done
