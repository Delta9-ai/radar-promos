# Liste de surveillance de Radar Promos
# ------------------------------------------------------------
# mode: revente -> l'outil calcule une marge de revente estimée
# mode: perso   -> pour toi : alerte dès qu'il y a une vraie promo / du stock
# search : ce qu'on tape dans la recherche des comparateurs
# doit_contenir : tous ces mots doivent être dans le titre de l'offre
# exclure : si un de ces mots est dans le titre, on ignore l'offre
# prix_max : (optionnel) alerte seulement en dessous de ce prix
# ------------------------------------------------------------

lego:
  # Tous les Lego Star Wars sont surveillés automatiquement via Avenue de la Brique
  star_wars_tous: true
  remise_min: 30          # % de remise mini vs prix LEGO pour alerter
  remise_min_retraite: 20 # plus souple si le set part bientôt à la retraite
  # Autres Lego : alerte si la promo est très bien notée par la communauté Dealabs
  autres_lego_temperature_min: 150

produits:
  # ---------- CONSOLES (pour toi) ----------
  - nom: PS5 (avec lecteur)
    categorie: Consoles
    mode: perso
    search: ps5 slim
    doit_contenir: [console, ps5]
    exclure: [digital, numérique, sans lecteur, manette, dualsense, jeu, pro, portal, reconditionn, occasion, casque, lecteur blu, support, station, câble, coque, skin]
